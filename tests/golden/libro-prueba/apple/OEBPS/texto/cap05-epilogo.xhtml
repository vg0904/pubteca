<h1 class="titulo-capitulo" id="h-cap05-epilogo">Epílogo</h1>
</div>
<p class="primero">El folleto de la estación sigue diciendo que el faro de Ibar está apagado desde 1986.</p>
<p>Si alguna vez pasan por ahí de noche, no lo mires mucho rato. Y si <em>tienes</em> que mirarlo, cuenta los segundos. Son once. Siempre son once.</p>
