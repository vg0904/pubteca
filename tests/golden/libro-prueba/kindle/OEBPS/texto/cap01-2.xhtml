<div class="continuacion">
<p>No durmió. A las cuatro de la mañana bajó a la cocina y encontró a la dueña despierta, con una taza entre las manos y la radio puesta muy baja.</p>
<p>—¿Lo oye? —preguntó la mujer.</p>
<p>Marta no oía nada. Dijo que sí.</p>
