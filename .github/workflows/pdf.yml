name: PDF de imprenta

# El PDF interior del libro de prueba (tests/fixtures/libro-impreso) y su
# cubierta, por las herramientas que no tenemos en el core: qpdf comprueba la
# sintaxis y los flujos, pdffonts que cada fuente va incrustada, y zbarimg que
# el codigo de barras de la cubierta se lee. Nuestra lista de PDF/X-1a la
# pasa el propio script (y los tests). No hay validador libre de PDF/X: la
# certificacion de verdad es el Preflight de Acrobat, ver plan.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Con reintentos: el 11 nov 2026 fallo dos veces porque el runner no
      # resolvia los espejos de Ubuntu (DNS), no por nada del PDF.
      - name: Instalar qpdf y poppler
        run: sudo apt-get -o Acquire::Retries=5 update -q && sudo apt-get -o Acquire::Retries=5 install -y -q qpdf poppler-utils zbar-tools

      - name: Generar los PDF (y pasar nuestra lista de PDF/X-1a)
        run: npm run pdfs

      - name: qpdf --check
        run: |
          for f in tmp/pdfs/*.pdf; do
            echo "== $f"
            qpdf --check "$f"
          done

      - name: pdffonts, todas incrustadas
        run: |
          fallos=0
          for f in tmp/pdfs/*.pdf; do
            echo "== $f"
            pdffonts "$f"
            # Columnas desde el final: emb sub uni objeto generacion.
            filas=$(pdffonts "$f" | tail -n +3 | wc -l)
            sin=$(pdffonts "$f" | tail -n +3 | awk '$(NF-4) != "yes"' | wc -l)
            if [ "$filas" -eq 0 ] || [ "$sin" -ne 0 ]; then
              echo "::error file=$f::$sin de $filas fuentes sin incrustar"
              fallos=1
            fi
          done
          exit $fallos

      # El codigo de barras de la cubierta, leido por un lector de verdad: la
      # cubierta pintada a 300 ppi (como la imprime KDP) y zbarimg encima.
      - name: El EAN-13 de la cubierta se lee (zbarimg)
        run: |
          for f in tmp/pdfs/cubierta-*.pdf; do
            pdftoppm -r 300 -png -singlefile "$f" "${f%.pdf}"
            leido=$(zbarimg --raw -q "${f%.pdf}.png" || true)
            echo "$f: $leido"
            if [ "$leido" != "9788409123452" ]; then
              echo "::error file=$f::el codigo de barras no se lee, o no dice el ISBN del impreso"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdfs
          path: tmp/pdfs/
